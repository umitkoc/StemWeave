name: Mobile workspace

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/piano-mobile/**"
      - "packages/**"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: read

jobs:
  workspace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stemweave/piano-mobile build
